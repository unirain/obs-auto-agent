name: Reading Agent
run-name: "reading:${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}:${{ inputs.mode == 'preview' && 'preview' || 'production' }}:${{ github.event_name == 'schedule' && 'production' || inputs.deployment }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (manual defaults to isolated preview)"
        type: choice
        options: [preview, scheduled, resume, publish-only]
        default: preview
        required: true
      deployment:
        description: "Trusted profile (integration only for isolated production-scope tests)"
        type: choice
        options: [preview, production, integration]
        default: preview
        required: true
      input_urls:
        description: "JSON URL array; no URLs accepted by resume/publish-only"
        type: string
        default: "[]"
      project_id:
        description: "Existing production project for resume/publish-only"
        type: string
      preview_id:
        description: "Existing preview identity (only preview mode)"
        type: string
      submission_id:
        description: "Stable manual production submission identity (optional)"
        type: string
  # G5 gate: enable only after the signed-off live acceptance evidence and first manual run.
  # schedule:
  #   - cron: '17 0 * * *' # Asia/Shanghai 08:17
permissions:
  contents: read
  actions: read
concurrency:
  group: reading-workspace-writer
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READING_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      READING_SHARED_MUTEX_HELD: 'true'
      READING_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      READING_PROFILE: ${{ github.event_name == 'schedule' && 'production' || inputs.deployment }}
      READING_INPUT_URLS_JSON: ${{ github.event_name == 'schedule' && '[]' || inputs.input_urls }}
      READING_PROJECT_ID: ${{ inputs.project_id }}
      READING_PREVIEW_ID: ${{ inputs.preview_id }}
      READING_SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - name: Record job deadline origin
        run: echo "READING_JOB_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - name: Reject invalid mode/profile combinations before any secret-bearing job
        run: |
          case "$READING_PROFILE" in
            preview) npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/preview.json ;;
            production) npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/production.json ;;
            integration) npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/integration.json ;;
            *) exit 1 ;;
          esac
  preview:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' &&
      inputs.deployment == 'preview' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: reading-preview
    env:
      READING_MODE: preview
      READING_SHARED_MUTEX_HELD: 'true'
      READING_TRIGGER: manual
      READING_INPUT_URLS_JSON: ${{ inputs.input_urls }}
      READING_PROJECT_ID: ${{ inputs.project_id }}
      READING_PREVIEW_ID: ${{ inputs.preview_id }}
      READING_SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - name: Record job deadline origin
        run: echo "READING_JOB_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Validate scope without secrets
        run: npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/preview.json
      - name: Verify trusted checked-in G1 evidence before generation
        if: github.event_name == 'schedule' || inputs.mode != 'publish-only'
        env:
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,realpath} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {assertG1Evidence} from './agents/reading/src/storage/gates.ts';
          const path=process.env.READING_G1_EVIDENCE_PATH;
          if(!path || !/^agents\/reading\/evals\/[A-Za-z0-9_./-]+\.json$/.test(path) || path.split('/').some(p=>!p || p==='.' || p==='..')) throw new Error('G1 evidence must be a checked-in non-secret eval JSON');
          execFileSync('git',['ls-files','--error-unmatch','--',path],{stdio:'pipe'});
          if(await realpath(path)!==resolve(path)) throw new Error('G1 evidence symlinks are forbidden');
          const committed=execFileSync('git',['show',`HEAD:${path}`],{maxBuffer:4000000});
          if(!committed.equals(await readFile(path))) throw new Error('G1 evidence must match trusted checkout HEAD');
          await assertG1Evidence(path,process.env.READING_G1_EVIDENCE_SHA256);
          NODE
      - name: Checkout quality examples and skills with readonly credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: unirain/obs-notes-hub
          fetch-depth: 0
          path: .reading-local/notes
          token: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          persist-credentials: false
      - name: Restore exact tool image for cold preview recovery
        id: tools_restore
        env:
          OSS_PREVIEW_CREDENTIALS: ${{ secrets.OSS_PREVIEW_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
          CACHE_REPOSITORY: ${{ github.repository }}
          CACHE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {previewToolBindingCli} from './dist/agents/reading/src/tools/runtime-cache-binding.js';
          import {runtimeCacheCli} from './dist/agents/reading/src/tools/runtime-cache.js';
          const binding=await previewToolBindingCli('agents/reading/deploy/examples/preview.json');
          const args=['restore','--root',process.cwd(),'--output-dir',join(process.env.RUNNER_TEMP,'tool-image-restore'),'--repository',process.env.CACHE_REPOSITORY,'--branch',process.env.CACHE_BRANCH];
          if(binding.fixed)args.push('--fixed-image',binding.fixed.image_id,'--fixed-manifest',binding.fixed.manifest_hash);
          const result=await runtimeCacheCli(args);
          await appendFile(process.env.GITHUB_OUTPUT,`status=${result.status}\nimage_id=${result.image_id??''}\n`);
          console.log(JSON.stringify(result));
          NODE
      - name: Build fixed tool container without credentials
        if: inputs.mode != 'publish-only' && steps.tools_restore.outputs.status == 'cache_miss'
        run: docker build --pull=false -t reading-tools:local -f agents/reading/tools/Dockerfile .
      - name: Prepare immutable tool image archive before generation
        if: inputs.mode != 'publish-only' && steps.tools_restore.outputs.status == 'cache_miss'
        id: tools_prepare
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          import {join} from 'node:path';
          import {runtimeCacheCli} from './dist/agents/reading/src/tools/runtime-cache.js';
          const result=await runtimeCacheCli(['prepare','--root',process.cwd(),'--image','reading-tools:local','--output-dir',join(process.env.RUNNER_TEMP,'tool-image-prepare')]);
          await appendFile(process.env.GITHUB_OUTPUT,`artifact_name=${result.artifact_name}\narchive_path=${result.archive_path}\nmanifest_path=${result.manifest_path}\nimage_id=${result.image_id}\n`);
          console.log(JSON.stringify(result));
          NODE
      - name: Retain exact runtime for subsequent preview runs
        if: inputs.mode != 'publish-only' && steps.tools_restore.outputs.status == 'cache_miss'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.tools_prepare.outputs.artifact_name }}
          path: |
            ${{ steps.tools_prepare.outputs.archive_path }}
            ${{ steps.tools_prepare.outputs.manifest_path }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Run isolated preview
        run: npm run reading -- run --from-actions --deployment agents/reading/deploy/examples/preview.json
        env:
          OSS_PREVIEW_CREDENTIALS: ${{ secrets.OSS_PREVIEW_CREDENTIALS }}
          DEEPSEEK_API_KEY: ${{ inputs.mode != 'publish-only' && secrets.DEEPSEEK_API_KEY || '' }}
          READING_CAPACITY_VIEW_CREDENTIALS: ${{ secrets.READING_CAPACITY_VIEW_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
          READING_REPOSITORY_READ_TOKEN: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          READING_NOTES_REPOSITORY: ${{ github.workspace }}/.reading-local/notes
          READING_TOOLS_IMAGE: ${{ steps.tools_restore.outputs.image_id || steps.tools_prepare.outputs.image_id }}
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
  production:
    needs: validate
    if: >-
      (github.event_name == 'schedule' || (inputs.mode != 'preview' && inputs.deployment == 'production')) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: reading-production
    env:
      READING_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      READING_SHARED_MUTEX_HELD: 'true'
      READING_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      READING_INPUT_URLS_JSON: ${{ github.event_name == 'schedule' && '[]' || inputs.input_urls }}
      READING_PROJECT_ID: ${{ inputs.project_id }}
      READING_PREVIEW_ID: ${{ inputs.preview_id }}
      READING_SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - name: Record job deadline origin
        run: echo "READING_JOB_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Validate scope without secrets
        run: npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/production.json
      - name: Verify trusted checked-in G1 evidence before generation
        if: github.event_name == 'schedule' || inputs.mode != 'publish-only'
        env:
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,realpath} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {assertG1Evidence} from './agents/reading/src/storage/gates.ts';
          const path=process.env.READING_G1_EVIDENCE_PATH;
          if(!path || !/^agents\/reading\/evals\/[A-Za-z0-9_./-]+\.json$/.test(path) || path.split('/').some(p=>!p || p==='.' || p==='..')) throw new Error('G1 evidence must be a checked-in non-secret eval JSON');
          execFileSync('git',['ls-files','--error-unmatch','--',path],{stdio:'pipe'});
          if(await realpath(path)!==resolve(path)) throw new Error('G1 evidence symlinks are forbidden');
          const committed=execFileSync('git',['show',`HEAD:${path}`],{maxBuffer:4000000});
          if(!committed.equals(await readFile(path))) throw new Error('G1 evidence must match trusted checkout HEAD');
          await assertG1Evidence(path,process.env.READING_G1_EVIDENCE_SHA256);
          NODE
      - name: Checkout quality examples and skills with readonly credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: unirain/obs-notes-hub
          fetch-depth: 0
          path: .reading-local/notes
          token: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          persist-credentials: false
      - name: Build fixed tool container without credentials
        if: github.event_name == 'schedule' || inputs.mode != 'publish-only'
        run: docker build --pull=false -t reading-tools:local -f agents/reading/tools/Dockerfile .
      - name: Run trusted production host
        run: npm run reading -- run --from-actions --deployment agents/reading/deploy/examples/production.json
        env:
          OSS_WORKSPACE_CREDENTIALS: ${{ secrets.OSS_WORKSPACE_CREDENTIALS }}
          OSS_IMAGE_CREDENTIALS: ${{ inputs.mode != 'publish-only' && secrets.OSS_IMAGE_CREDENTIALS || '' }}
          READING_GITHUB_APP: ${{ secrets.READING_GITHUB_APP }}
          DEEPSEEK_API_KEY: ${{ inputs.mode != 'publish-only' && secrets.DEEPSEEK_API_KEY || '' }}
          READING_CAPACITY_VIEW_CREDENTIALS: ${{ secrets.READING_CAPACITY_VIEW_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
          READING_REPOSITORY_READ_TOKEN: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          READING_NOTES_REPOSITORY: ${{ github.workspace }}/.reading-local/notes
          READING_TOOLS_IMAGE: ${{ inputs.mode != 'publish-only' && 'reading-tools:local' || '' }}
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
  integration:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode != 'preview' &&
      inputs.deployment == 'integration' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: reading-integration
    env:
      READING_MODE: ${{ inputs.mode }}
      READING_SHARED_MUTEX_HELD: 'true'
      READING_TRIGGER: manual
      READING_INPUT_URLS_JSON: ${{ inputs.input_urls }}
      READING_PROJECT_ID: ${{ inputs.project_id }}
      READING_PREVIEW_ID: ${{ inputs.preview_id }}
      READING_SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - name: Record job deadline origin
        run: echo "READING_JOB_STARTED_AT=$(date +%s000)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Validate scope without secrets
        run: npm run reading -- validate-dispatch --deployment agents/reading/deploy/examples/integration.json
      - name: Verify trusted checked-in G1 evidence before generation
        if: github.event_name == 'schedule' || inputs.mode != 'publish-only'
        env:
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,realpath} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {assertG1Evidence} from './agents/reading/src/storage/gates.ts';
          const path=process.env.READING_G1_EVIDENCE_PATH;
          if(!path || !/^agents\/reading\/evals\/[A-Za-z0-9_./-]+\.json$/.test(path) || path.split('/').some(p=>!p || p==='.' || p==='..')) throw new Error('G1 evidence must be a checked-in non-secret eval JSON');
          execFileSync('git',['ls-files','--error-unmatch','--',path],{stdio:'pipe'});
          if(await realpath(path)!==resolve(path)) throw new Error('G1 evidence symlinks are forbidden');
          const committed=execFileSync('git',['show',`HEAD:${path}`],{maxBuffer:4000000});
          if(!committed.equals(await readFile(path))) throw new Error('G1 evidence must match trusted checkout HEAD');
          await assertG1Evidence(path,process.env.READING_G1_EVIDENCE_SHA256);
          NODE
      - name: Checkout quality examples and skills with readonly credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: unirain/obs-notes-hub
          fetch-depth: 0
          path: .reading-local/notes
          token: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          persist-credentials: false
      - name: Build fixed tool container without credentials
        if: github.event_name == 'schedule' || inputs.mode != 'publish-only'
        run: docker build --pull=false -t reading-tools:local -f agents/reading/tools/Dockerfile .
      - name: Run isolated production-scope acceptance
        run: npm run reading -- run --from-actions --deployment agents/reading/deploy/examples/integration.json
        env:
          OSS_TEST_CREDENTIALS: ${{ secrets.OSS_TEST_CREDENTIALS }}
          OSS_TEST_IMAGE_CREDENTIALS: ${{ inputs.mode != 'publish-only' && secrets.OSS_TEST_IMAGE_CREDENTIALS || '' }}
          TEST_GITHUB_APP: ${{ secrets.TEST_GITHUB_APP }}
          DEEPSEEK_API_KEY: ${{ inputs.mode != 'publish-only' && secrets.DEEPSEEK_API_KEY || '' }}
          READING_CAPACITY_VIEW_CREDENTIALS: ${{ secrets.READING_CAPACITY_VIEW_CREDENTIALS }}
          GITHUB_TOKEN: ${{ github.token }}
          READING_REPOSITORY_READ_TOKEN: ${{ secrets.READING_REPOSITORY_READ_TOKEN }}
          READING_NOTES_REPOSITORY: ${{ github.workspace }}/.reading-local/notes
          READING_TOOLS_IMAGE: ${{ inputs.mode != 'publish-only' && 'reading-tools:local' || '' }}
          READING_G1_EVIDENCE_PATH: ${{ vars.READING_G1_EVIDENCE_PATH }}
          READING_G1_EVIDENCE_SHA256: ${{ vars.READING_G1_EVIDENCE_SHA256 }}
