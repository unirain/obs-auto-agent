name: Reading Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: "47 2,14 * * *" # Asia/Shanghai 10:47 and 22:47
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: reading-watchdog-issues
  cancel-in-progress: false
jobs:
  watchdog:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reading-watchdog
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci
      - name: Independently inspect Actions and readonly committed OSS reports
        run: npm run reading -- watchdog --deployment agents/reading/deploy/examples/production.json
        env:
          READING_MONITOR_OSS_CREDENTIALS: ${{ secrets.READING_MONITOR_OSS_CREDENTIALS }}
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READING_REPOSITORY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
